[project]
name = "job-tracker"
version = "0.1.0"
description = "LinkedIn job URLs -> structured JSON -> Google Sheet tracker (then LLM scoring and resume tailoring)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "gspread>=6.0",
]

[project.scripts]
job-tracker = "job_tracker.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_tracker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
