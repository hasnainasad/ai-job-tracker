[project]
name = "job-tracker"
version = "0.1.0"
description = "LinkedIn job URLs -> structured JSON -> Google Sheet tracker (then LLM scoring and resume tailoring)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "gspread>=6.0",
    "anthropic>=2.14",
    "reportlab>=4.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
    "mcp>=2.3",
    "openai-agents>=0.26",
    "chromadb>=1.5",
]

[project.scripts]
job-tracker = "job_tracker.cli:main"
job-tracker-api = "job_tracker.api:main"
job-tracker-mcp = "job_tracker.mcp_server:main"
job-tracker-agent = "job_tracker.agent_cli:main"

[project.optional-dependencies]
tracing = [
    "langfuse>=5.2.0",
    "openinference-instrumentation-openai-agents>=2.8.7",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_tracker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
